name: Vercel Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      # Decide which deploy path (if any) is configured. This workflow is an
      # optional CLI/hook-based deploy path; production is normally deployed by
      # Vercel's native Git integration. When no credentials are configured we
      # skip cleanly instead of failing, so the native integration stays the
      # single source of truth without this job emitting a red X on every push.
      - name: Detect deployment mode
        id: mode
        shell: bash
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "mode=hook" >> "$GITHUB_OUTPUT"
            echo "Deploy hook configured — will POST the Vercel deploy hook."
          elif [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "mode=cli" >> "$GITHUB_OUTPUT"
            echo "Vercel CLI credentials configured — will build and deploy via the CLI."
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::No Vercel deploy credentials configured; skipping this workflow. Production is deployed by Vercel's native Git integration. To deploy from this workflow instead, set VERCEL_DEPLOY_HOOK_URL, or all of VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
          fi

      - name: Trigger Vercel deploy hook
        if: steps.mode.outputs.mode == 'hook'
        shell: bash
        run: |
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Setup Node
        if: steps.mode.outputs.mode == 'cli'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.mode.outputs.mode == 'cli'
        run: npm ci

      - name: Link Vercel project
        if: steps.mode.outputs.mode == 'cli'
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel environment
        if: steps.mode.outputs.mode == 'cli'
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        if: steps.mode.outputs.mode == 'cli'
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        if: steps.mode.outputs.mode == 'cli'
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
